name: Terraform plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_my_ip: ${{ vars.MY_IP }}
    steps:
      - uses: actions/checkout@v4
      - name: Show the OIDC claims GitHub sends (debug)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,base64,json; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['iss','aud','sub','repository','repository_owner','ref','event_name']},indent=2))" "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color | tee plan.txt
      - name: Show the plan on the run page
        if: always()
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 80 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
